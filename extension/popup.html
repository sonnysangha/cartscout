<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CartScout</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <img class="mark" src="icons/icon-128.png" width="40" height="40" alt="CartScout">
    <div class="heading">
      <h1 id="merchant">Find savings</h1>
      <p id="status" role="status">Reading the current shop…</p>
    </div>
    <span id="basket-marker" hidden>In your basket</span>
  </header>

  <nav id="views" aria-label="Shopping tools" hidden>
    <button id="show-coupons" aria-controls="coupon-view" aria-pressed="true">Coupons</button>
    <button id="show-alternatives" aria-controls="alternatives" aria-pressed="false">Other retailers</button>
  </nav>

  <main>
    <section id="coupon-view" aria-label="Coupons">
      <section id="checkout" class="checkout" aria-label="Try checkout codes" hidden>
        <div id="checkout-savings" hidden>
          <p class="saved-hero">You saved <strong id="saved-amount"></strong></p>
          <dl class="receipt">
            <div>
              <dt>Working code</dt>
              <dd>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5V6a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 17 6v1.5a2.5 2.5 0 0 0 0 5V14a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14v-1.5a2.5 2.5 0 0 0 0-5Z"/><path d="M12 7.5v5" stroke-dasharray=".1 2.4"/></svg>
                <span id="saved-code"></span>
              </dd>
            </div>
            <div><dt>Original</dt><dd id="saved-before"></dd></div>
            <div><dt>With CartScout</dt><dd id="saved-after"></dd></div>
          </dl>
        </div>
        <p id="checkout-status" role="status"></p>
        <progress id="checkout-progress" aria-label="Checkout codes tried" hidden></progress>
        <div class="actions">
          <button id="try-codes" class="primary">Try codes at checkout</button>
          <button id="stop-codes" class="secondary" hidden>Stop after this code</button>
        </div>
      </section>
      <ol id="coupons" aria-label="Available coupon codes"></ol>
      <div class="empty-state">
        <svg class="empty-art" viewBox="0 0 72 44" aria-hidden="true">
          <path d="M9 1h36a5 5 0 0 0 10 0h8a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8h-8a5 5 0 0 0-10 0H9a8 8 0 0 1-8-8V9a8 8 0 0 1 8-8Z"/>
          <path class="empty-art-tear" d="M50 11v22"/>
        </svg>
        <p id="coupon-empty" class="empty" hidden></p>
        <button id="scan-store" class="primary" hidden>Scan this store</button>
        <button id="retry" class="secondary" hidden>Try again</button>
      </div>
    </section>

    <section id="alternatives" aria-label="Find other retailers" hidden>
      <div class="market-row">
        <label for="market" class="visually-hidden">Shop in</label>
        <select id="market"></select>
        <button id="find-alternatives" class="primary">Find alternatives</button>
      </div>
      <p id="alternatives-status" role="status"></p>
      <div id="alternative-results"></div>
      <button id="more-alternatives" class="secondary" hidden>Check more basket products</button>
    </section>
  </main>

  <footer>
    <section id="account-panel" aria-label="CartScout account">
      <p class="account-text"><strong id="account-plan"></strong><span id="account-detail" role="status">Checking sign-in…</span></p>
      <button id="account-refresh" class="icon-button" aria-label="Refresh plan" title="Refresh plan" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.4 3.4v3.4H13"/></svg>
      </button>
      <button id="account-action" class="quiet" hidden>Sign in</button>
    </section>
    <p class="attribution">Search and product data by Oxylabs</p>
  </footer>

  <template id="coupon">
    <li class="coupon">
      <button type="button" class="coupon-ticket">
        <span class="ticket-content">
          <span class="code"></span>
          <span class="offer"></span>
        </span>
        <span class="ticket-stub" aria-hidden="true">
          <span class="ticket-icon">
            <svg class="icon-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2.5"/><path d="M13 7V5.5a2 2 0 0 0-2-2H5.5a2 2 0 0 0-2 2V11a2 2 0 0 0 2 2H7"/></svg>
            <svg class="icon-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></svg>
          </span>
          <span class="ticket-action">Copy</span>
        </span>
      </button>
      <span class="visually-hidden copy-feedback" role="status"></span>
      <p class="trial-result" hidden></p>
      <div class="coupon-feedback">
        <div class="votes" role="group">
          <span class="votes-label" aria-hidden="true">Did it work?</span>
          <button type="button" class="worked secondary" aria-pressed="false">Yes</button>
          <button type="button" class="failed secondary" aria-pressed="false">No</button>
        </div>
        <details class="coupon-more">
          <summary>Details</summary>
          <div class="coupon-detail">
            <p class="counts"></p>
            <p class="sources"></p>
          </div>
        </details>
      </div>
    </li>
  </template>
</body>
</html>
